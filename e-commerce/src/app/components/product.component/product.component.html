<div class="product" >
    @if (!!product?.imgUrl){
        <img [src]="product.imgUrl" alt="" >
    } @else {
        <img  src="assets/img/no_img.jpg" >
    }
    <h3>{{product.title}}</h3>
    <h2 [ngClass]="{'promotion': !!product.promotion }">{{product.price}} $</h2>
    <button (click)="addToCart()" >Aggiungi al carrello</button>
</div>
